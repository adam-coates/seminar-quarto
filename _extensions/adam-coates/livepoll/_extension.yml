title: Livepoll
author: Adam Coates
version: 1.7.0
quarto-required: ">=1.4.0"
contributes:
  filters:
    # injects the CDN dependencies + the control panel into <head>
    - livepoll.lua
  revealjs-plugins:
    - name: RevealSeminar
      script:
        - seminar.js
      config:
        seminar:
          # Override these three per deck, in the deck's own front matter:
          #   format:
          #     revealjs:
          #       seminar:
          #         url: "my-course"      # venue
          #         room: "week-01"
          #         hash: "$2a$05$..."    # bcrypt hash of the host password
          server: "http://localhost:8080"
          autoJoin: true
          # resolved to window.seminarStatusLogger by seminar.js
          logger: seminarStatusLogger
    - name: RevealChart
      script:
        - chart.js
      config:
        chart:
          defaults:
            maintainAspectRatio: false
            responsive: true
            color: "lightgray"
            font:
              size: 30
            scale:
              beginAtZero: true
              ticks:
                stepSize: 1
              grid:
                color: "lightgray"
          bar:
            backgroundColor: ["firebrick", "darkred", "red"]
          pie:
            backgroundColor: [["black", "red", "green", "yellow"]]
    - name: RevealPoll
      script:
        - poll.js
    # Records the class: Alt+R downloads session.json (poll tallies, word-cloud
    # counts, Excalidraw drawings). Put it beside the deck and re-render, and
    # livepoll.lua replays the results on the slides.
    - name: RevealSession
      script:
        - session.js
      config:
        session:
          # Alt+R, not Alt+S: reveal opens the speaker view on S whatever the
          # modifiers. session.js takes the key in the capture phase and stops
          # it, so either is safe, but R avoids the question.
          shortcut: "r"
          filename: "session.json"
