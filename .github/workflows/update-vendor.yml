# Weekly check for new releases of the JavaScript libraries bundled in
# _extensions/adam-coates/livepoll/vendor/. When there are any, it opens (or
# updates) a pull request with the new files; nothing changes until you merge.
#
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests".
name: Update vendored JS libraries

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch: # or run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write
  actions: write # to start the tests on the pull request's branch

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: update
        run: bash .github/scripts/update-vendor.sh

      - if: steps.update.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: vendor-updates
          delete-branch: true
          commit-message: Update vendored JS libraries
          title: Update vendored JS libraries
          body: |
            New releases of the libraries bundled with livepoll:

            ${{ steps.update.outputs.summary }}

            The files, the table and licence texts in `vendor/`, and the
            dependency version in `livepoll.lua` are updated. The browser
            tests run on this branch; merge once the `browser-tests` check
            passes.

      # A pull request opened with the workflow's own token doesn't trigger
      # tests.yml, so start it here on the branch; its result shows on the PR.
      - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        run: gh workflow run tests.yml --ref vendor-updates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
